services:
  app:
    build: .
    container_name: devops-final-app
    ports:
      - "3000:3000"
    networks:
      - devops-net

  prometheus:
    image: prom/prometheus:latest
    container_name: devops-final-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - devops-net
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: devops-final-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - devops-net
    depends_on:
      - prometheus

networks:
  devops-net:
    driver: bridge
